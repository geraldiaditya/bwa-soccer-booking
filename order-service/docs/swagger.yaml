basePath: /api/v1
definitions:
  dto.OrderRequest:
    properties:
      fieldScheduleIDs:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - fieldScheduleIDs
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      requestId:
        type: string
      status:
        type: string
      token:
        type: string
    type: object
host: localhost:8003
info:
  contact: {}
  description: Microservice for managing soccer booking orders and payments.
  title: Order Service API
  version: "1.0"
paths:
  /order:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of all orders with optional sorting
      parameters:
      - description: Page number
        in: query
        name: page
        required: true
        type: integer
      - description: Page limit
        in: query
        name: limit
        required: true
        type: integer
      - description: Sort column
        in: query
        name: sortColumn
        type: string
      - description: Sort order
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get all orders with pagination
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Create a new booking order for soccer field schedules
      parameters:
      - description: Order details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Create a new order
      tags:
      - orders
  /order/{uuid}:
    get:
      consumes:
      - application/json
      description: Retrieve order details by UUID
      parameters:
      - description: Order UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get order by UUID
      tags:
      - orders
  /order/user:
    get:
      consumes:
      - application/json
      description: Retrieve a list of orders for the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get orders by user ID
      tags:
      - orders
swagger: "2.0"
